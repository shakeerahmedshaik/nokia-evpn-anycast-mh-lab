# EVPN Anycast Multi-Homing lab (draft-rabnag-bess-evpn-anycast-aliasing, Figure 1 shape)
#
#   spine1 10.0.0.1 (AS65100, EVPN RR)      spine2 10.0.0.2 (AS65100, EVPN RR)
#        e1-1 / e1-2 / e1-3                      e1-1 / e1-2 / e1-3
#          full mesh: every leaf e1-1 -> spine1, e1-2 -> spine2
#
#   leaf1 10.0.1.1 (AS65001)   leaf2 10.0.1.2 (AS65002)   leaf3 10.0.1.3 (AS65003)
#   lo1 12.12.12.12 anycast    lo1 12.12.12.12 anycast    ingress PE, no anycast config
#          e1-10 \    ES-1 / lag1    / e1-10                    | e1-10
#                 ts1 bond0 (LACP 802.3ad)                      ts3
#                 192.168.100.1/24                              192.168.100.3/24
#
# Same file is consumed by:
#   - VS Code containerlab extension (right-click -> Deploy)
#   - `sudo containerlab deploy -t anycast-mh.clab.yml`
#   - clabverter -> clabernetes (c9s) Topology CR (c9s/anycast-mh-c9s.yaml, see README.md)
name: anycast-mh

mgmt:
  network: anycast-mh-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:26.7.2
      type: ixr-d3l
    linux:
      image: ghcr.io/srl-labs/network-multitool

  nodes:
    spine1:
      kind: nokia_srlinux
      startup-config: configs/spine1.cli
    spine2:
      kind: nokia_srlinux
      startup-config: configs/spine2.cli
    leaf1:
      kind: nokia_srlinux
      startup-config: configs/leaf1.cli
    leaf2:
      kind: nokia_srlinux
      startup-config: configs/leaf2.cli
    leaf3:
      kind: nokia_srlinux
      startup-config: configs/leaf3.cli

    ts1:
      kind: linux
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast xmit_hash_policy layer3+4
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set bond0 up
        - ip addr add 192.168.100.1/24 dev bond0
    ts3:
      kind: linux
      exec:
        - ip addr add 192.168.100.3/24 dev eth1

  links:
    - endpoints: ["spine1:e1-1", "leaf1:e1-1"]
    - endpoints: ["spine1:e1-2", "leaf2:e1-1"]
    - endpoints: ["spine1:e1-3", "leaf3:e1-1"]
    - endpoints: ["spine2:e1-1", "leaf1:e1-2"]
    - endpoints: ["spine2:e1-2", "leaf2:e1-2"]
    - endpoints: ["spine2:e1-3", "leaf3:e1-2"]
    - endpoints: ["ts1:eth1", "leaf1:e1-10"]
    - endpoints: ["ts1:eth2", "leaf2:e1-10"]
    - endpoints: ["ts3:eth1", "leaf3:e1-10"]
